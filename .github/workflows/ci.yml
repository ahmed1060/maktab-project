name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The version production runs: Vercel's project setting is 24.x,
          # and package.json's engines field and .nvmrc say the same, so CI,
          # local development and production are one Node. (Prisma 7 wants
          # ^20.19 || ^22.12 || >=24, Next 16 wants >=20.9.)
          node-version: 24
          cache: 'npm'

      # `npm ci`'s postinstall runs `prisma generate`, which only reads
      # schema.prisma — no database connection needed for typecheck/lint/tests.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `next lint` was removed in Next 16; the ESLint CLI replaces it.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run
