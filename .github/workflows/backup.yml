name: Backup to Google Drive

on:
  schedule:
    - cron: '0 1 * * *'          # 01:00 UTC = 03:00 Africa/Cairo (UTC+2 winter)
  workflow_dispatch:              # manual "Run workflow" button
    inputs:
      label:
        description: 'Optional label for this backup'
        required: false
        default: 'manual'
  repository_dispatch:            # fired from the dashboard maintenance page
    types: [manual-backup]

concurrency:
  group: maktab-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # A throwaway Postgres to load each night's dump back into, so "the backup
    # ran" and "the backup can be restored" stop being the same claim. It never
    # sees production: the only thing that reaches it is the file this job just
    # produced.
    #
    # A plain postgres image rather than Supabase's, because nothing
    # Supabase-specific survives the --exclude-schema list below, the schema
    # declares no extensions, and every primary key is generated in the
    # application. What comes out of pg_dump here is ordinary Postgres.
    services:
      verifier:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates gnupg age jq
          # ubuntu-latest's default apt repos only carry postgresql-client-16,
          # but Supabase runs Postgres 17 — pg_dump refuses to dump from a
          # server newer than itself ("aborting because of server version
          # mismatch"). Add the official PGDG apt repo to get a matching
          # client instead. Bump the version below if Supabase upgrades again.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone remote
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      # Before spending thirty seconds on a dump that has nowhere to go. The
      # credential is the single most likely thing to be wrong — it expires on
      # its own, it lives in two places that can drift apart, and when it fails
      # rclone reports it as a page of URL-encoded Drive query, a hundred
      # seconds into the run, three times over.
      - name: Check the Drive credential first
        run: |
          if rclone lsd gdrive: >/dev/null 2>/tmp/gdrive-err; then
            echo "Google Drive reachable."
            exit 0
          fi

          if grep -q invalid_grant /tmp/gdrive-err; then
            echo "::error::invalid_grant — Google rejected the refresh token."
            echo "::error::RCLONE_CONFIG_GDRIVE_TOKEN is stale, malformed, or was minted"
            echo "::error::against a different client_id/client_secret than the two secrets"
            echo "::error::beside it. Re-mint with 'rclone config reconnect gdrive:' and"
            echo "::error::update BOTH the GitHub secret and the Vercel env var of that name."
          else
            echo "::error::Google Drive is unreachable, and not because of the token."
          fi

          # Redact anything long enough to be a credential before printing the
          # underlying error: rclone echoes the full request, and the folder id
          # travels in it.
          sed -E 's/[A-Za-z0-9_-]{20,}/***/g' /tmp/gdrive-err
          exit 1

      - name: Dump database
        env:
          PGCONN: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          # pipefail, because the default shell here is `bash -e` without it:
          # a pg_dump that dies mid-stream otherwise leaves a truncated .gz and
          # the step still exits 0 on gzip's success. The verify step below
          # catches that too, but a failure should fail where it happens.
          set -o pipefail
          STAMP=$(TZ=Africa/Cairo date +%Y-%m-%d_%H%M)
          KIND="${{ github.event_name == 'schedule' && 'auto' || 'manual' }}"
          echo "NAME=maktab_${STAMP}_${KIND}" >> $GITHUB_ENV
          # Call the versioned binary directly rather than the unversioned
          # `pg_dump` on PATH — installing postgresql-client-17 alongside
          # the runner image's pre-existing postgresql-client-16 doesn't
          # make 17 the one PATH resolves to.
          #
          # The exclusion list is every Supabase-managed schema; public is the
          # app. cron and graphql_public were added after a restore check failed
          # on "COPY cron.job ... schema cron does not exist" — pg_cron's own
          # tables were being dumped while the extension that creates their
          # schema is not something a plain Postgres can install. Both hold no
          # application data: cron.job was verified empty, graphql_public has no
          # tables at all.
          /usr/lib/postgresql/17/bin/pg_dump "$PGCONN" \
            --no-owner --no-privileges --clean --if-exists \
            --exclude-schema='auth|storage|graphql|graphql_public|cron|realtime|extensions|vault|_realtime|supabase_*' \
            | gzip -9 > db.sql.gz
          ls -lh db.sql.gz

      - name: Verify the dump is not empty or truncated
        run: |
          set -o pipefail
          test "$(stat -c%s db.sql.gz)" -gt 10240 || { echo "Dump suspiciously small"; exit 1; }
          gzip -t db.sql.gz
          zcat db.sql.gz | tail -5 | grep -q "PostgreSQL database dump complete" \
            || { echo "Dump is truncated"; exit 1; }

      - name: Mirror the storage bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Supabase's S3-compatible endpoint needs its own dedicated
          # access-key pair (Storage -> S3 Configuration -> Access keys in
          # the dashboard) — the service_role key isn't valid here at all,
          # even though it was previously (incorrectly) reused for both
          # fields below and never actually exercised until this workflow
          # ran for real.
          S3_ACCESS_KEY_ID:     ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          cat >> ~/.config/rclone/rclone.conf <<EOF
          [supa]
          type = s3
          provider = Other
          access_key_id = ${S3_ACCESS_KEY_ID}
          secret_access_key = ${S3_SECRET_ACCESS_KEY}
          endpoint = ${SUPABASE_URL}/storage/v1/s3
          region = eu-west-1
          EOF

          # This copy used to end in `|| true`, which made the asset half of
          # every backup unfailable: broken S3 credentials produced an empty
          # directory, a valid-looking tarball, and a green run. That mattered
          # far more than it looked, because restore.yml *syncs* this directory
          # over the bucket — so a backup that silently captured nothing became
          # a restore that deliberately deleted everything.
          mkdir -p ./assets
          rclone copy supa:app-assets ./assets --transfers 8 --fast-list

          # The manifest is what lets the other end tell "this snapshot is
          # genuinely empty" from "this snapshot failed to copy". It travels
          # inside the tarball beside the tree it describes, never inside
          # ./assets itself — anything under there would be synced into the
          # bucket on restore.
          rclone size supa:app-assets --json > manifest.json
          cat manifest.json

          EXPECTED=$(jq -r '.count' manifest.json)
          COPIED=$(find ./assets -type f | wc -l)
          echo "bucket reports $EXPECTED objects; copied $COPIED files"
          test "$COPIED" -ge "$EXPECTED" \
            || { echo "Asset mirror incomplete: expected $EXPECTED, copied $COPIED"; exit 1; }

          tar -czf assets.tar.gz assets manifest.json

      - name: Encrypt
        run: |
          echo "${{ secrets.AGE_PUBLIC_KEY }}" > key.pub
          age -R key.pub -o "${NAME}_db.sql.gz.age"     db.sql.gz
          age -R key.pub -o "${NAME}_assets.tar.gz.age" assets.tar.gz
          rm -f assets.tar.gz key.pub

      - name: Upload to Google Drive
        run: |
          DEST="daily"
          [ "$(date +%u)" = "7" ] && DEST="weekly"
          [ "$(date +%d)" = "01" ] && DEST="monthly"
          rclone copy "${NAME}_db.sql.gz.age"     "gdrive:${DEST}/" -P
          rclone copy "${NAME}_assets.tar.gz.age" "gdrive:${DEST}/" -P

      # Deliberately after the upload, not before. A dump that fails to load is
      # still better than no dump at all, so it gets stored and *then* flagged;
      # and because this failing stops the job, the prune below never runs, so
      # a night that cannot prove itself also cannot age out the nights that
      # could.
      - name: Prove the dump restores
        env:
          PGPASSWORD: verify
        run: |
          set -o pipefail
          /usr/lib/postgresql/17/bin/psql -h localhost -U postgres -c 'CREATE DATABASE verify'

          # Extensions are environment, not data. Supabase installs pg_cron and
          # friends into pg_catalog, which --exclude-schema does not cover, so
          # the dump carries CREATE EXTENSION statements for them. A stock
          # postgres image has none of those extensions available, and with
          # ON_ERROR_STOP the first one aborts the whole load.
          #
          # They stay in the dump, because a real restore goes back to Supabase
          # where the extensions exist and IF NOT EXISTS makes them harmless.
          # They are only skipped here, where the question is whether the tables
          # and rows come back — and skipping them is printed rather than
          # silent, so the list cannot quietly grow.
          echo "Extension statements skipped for this check:"
          zcat db.sql.gz | grep -E '^(CREATE|COMMENT ON) EXTENSION' || echo "  (none)"

          gunzip -c db.sql.gz \
            | grep -vE '^(CREATE|COMMENT ON) EXTENSION' \
            | /usr/lib/postgresql/17/bin/psql -h localhost -U postgres -d verify \
              --single-transaction -v ON_ERROR_STOP=1 -q

          # Loading without error is most of the answer; these counts are the
          # rest of it. A dump that applies cleanly and restores an empty
          # database is the failure this catches.
          #
          # One count per query rather than one concatenated line: the table
          # names need double quotes to survive Postgres folding them to
          # lowercase, which leaves no quoting left over for string literals
          # inside the same -c argument.
          count() {
            /usr/lib/postgresql/17/bin/psql -h localhost -U postgres -d verify -At -c "SELECT count(*) FROM \"$1\""
          }
          USERS=$(count User)
          COMPANIES=$(count Company)
          TASKS=$(count Task)

          echo "restored: $USERS users, $COMPANIES companies, $TASKS tasks"
          echo "RESTORE_ROWS=$USERS users, $COMPANIES companies, $TASKS tasks" >> $GITHUB_ENV

          test "$USERS" -gt 0 || { echo "Dump restored but holds no users"; exit 1; }

      - name: Prune old backups
        run: |
          # || true on each: a folder that has never received a backup yet
          # (e.g. weekly/monthly, before this has run on a Sunday or the
          # 1st of a month) makes rclone delete fail with "directory not
          # found" rather than no-op — not a real error, just nothing to
          # prune yet.
          rclone delete gdrive:daily   --min-age 7d   || true
          rclone delete gdrive:weekly  --min-age 28d  || true
          rclone delete gdrive:monthly --min-age 365d || true

      - name: Report
        if: always()
        run: |
          echo "### Backup ${{ job.status }} — $NAME" >> $GITHUB_STEP_SUMMARY
          echo "Restore check: ${RESTORE_ROWS:-did not run}" >> $GITHUB_STEP_SUMMARY
          rclone size gdrive: >> $GITHUB_STEP_SUMMARY
