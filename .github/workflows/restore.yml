name: Restore from Backup

# The target, in the run's own title.
#
# This is what lets anything outside GitHub tell a drill from a real restore:
# workflow inputs are not returned by the Actions runs API, but run-name is, as
# display_title. The payroll clear reads it, because "a restore has been proved
# against a scratch database" has to be a fact you can check rather than a box
# somebody ticks.
#
# `||` here is a plain default-if-empty, not the fall-through that nearly sent a
# drill at production (see the note on PGCONN below). It is safe because of
# which way it fails: an empty or missing input yields 'production', so a drill
# can be mislabelled as a real restore but a real restore can never be
# mislabelled as a drill. The gate only ever gets stricter.
run-name: Restore [${{ github.event.inputs.target || 'production' }}] by @${{ github.actor }}

on:
  workflow_dispatch:              # manual "Run workflow" button, with inputs
    inputs:
      target:
        description: 'Where to restore INTO'
        required: false
        type: choice
        default: production
        options:
          - production
          - drill
      mode:
        description: 'latest (newest backup found) or specific'
        required: false
        default: 'latest'
      folder:
        description: 'daily | weekly | monthly | prerestore (only used when mode=specific)'
        required: false
      baseName:
        description: 'Backup base name, e.g. maktab_2026-09-05_0807_auto (only used when mode=specific)'
        required: false
  repository_dispatch:            # fired from the dashboard's Disaster Recovery card
    types: [manual-restore]

# Shares backup.yml's concurrency group on purpose — a backup and a restore
# must never run against the same database at the same time.
concurrency:
  group: maktab-backup
  cancel-in-progress: false

# `drill` restores into DRILL_DATABASE_URL instead of production, so this whole
# path can be exercised end to end without production being the test subject.
# That was the reason it had never been run: every mode, on every path, pointed
# at the live database, which is a good reason not to rehearse and one that was
# never going to stop being true.
#
# The target is a choice between two secrets rather than a connection string
# typed into the box, because a workflow input is not masked: it appears in the
# run's own parameter list, in the log, and in the API. A secret is redacted.
#
# Both secrets have to hold a *Session pooler* connection string, not the
# "Direct connection" one the Supabase dashboard offers first. db.<ref>.supabase.co
# resolves to IPv6 only, and a GitHub Actions runner has no IPv6 route, so a
# direct URL fails here with "Network is unreachable" — which reads like the
# database is down rather than like a wrong hostname. The session pooler
# (aws-N-<region>.pooler.supabase.com:5432, username postgres.<ref>) is IPv4 and
# holds one connection for the session, so --single-transaction behaves exactly
# as it does on a direct connection.
#
# Not the *transaction* pooler on 6543: it hands a different backend out per
# statement, so a restore wrapped in one transaction cannot work on it at all.
env:
  IS_DRILL: ${{ github.event.inputs.target == 'drill' }}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates gnupg age jq
          # Same pg_dump/psql version story as backup.yml: ubuntu-latest's
          # default apt repos only carry postgresql-client-16, but Supabase
          # runs Postgres 17.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone remotes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          S3_ACCESS_KEY_ID:     ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}

          [supa]
          type = s3
          provider = Other
          access_key_id = ${S3_ACCESS_KEY_ID}
          secret_access_key = ${S3_SECRET_ACCESS_KEY}
          endpoint = ${SUPABASE_URL}/storage/v1/s3
          region = eu-west-1
          EOF

      # Unconditional on every real restore: whatever is about to be overwritten
      # gets one more snapshot first, in its own folder so it's obviously
      # "the state right before a restore" rather than mixed into the
      # normal daily/weekly/monthly rotation.
      #
      # Skipped for a drill, where there is nothing of value to protect and the
      # only effect would be junk in gdrive:prerestore.
      - name: Pre-restore safety backup
        if: env.IS_DRILL != 'true'
        env:
          PGCONN: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          set -o pipefail
          STAMP=$(TZ=Africa/Cairo date +%Y-%m-%d_%H%M)
          echo "PRENAME=maktab_${STAMP}_prerestore" >> $GITHUB_ENV
          # Same flags as backup.yml's, and that matters more here than
          # anywhere: this is the snapshot somebody restores *after* a restore
          # went wrong, so a snapshot taken on different terms from the backups
          # it sits beside is a trap laid for the worst moment. --schema=public
          # is what keeps Supabase's own event triggers and extensions — which
          # the postgres role cannot drop or create — out of the file.
          /usr/lib/postgresql/17/bin/pg_dump "$PGCONN" \
            --no-owner --no-privileges \
            --schema=public \
            | gzip -9 > pre_db.sql.gz
          test "$(stat -c%s pre_db.sql.gz)" -gt 10240 || { echo "Pre-restore dump suspiciously small"; exit 1; }

          # Staged under a scratch directory whose *contents* are named assets/,
          # so the tarball's root entry matches what every other snapshot uses
          # and the restore path below can read it back. It used to tar a
          # directory called pre_assets/, which meant the safety net's own
          # output was the one thing in the system that the tool which made it
          # could not restore.
          #
          # The scratch directory is removed immediately: the download step
          # extracts assets/ into the workspace, and two trees of that name
          # would merge into one sync.
          mkdir -p prerestore-stage/assets
          rclone copy supa:app-assets ./prerestore-stage/assets --transfers 8 --fast-list
          rclone size supa:app-assets --json > prerestore-stage/manifest.json
          tar -czf pre_assets.tar.gz -C prerestore-stage assets manifest.json
          rm -rf prerestore-stage

          echo "${{ secrets.AGE_PUBLIC_KEY }}" > key.pub
          age -R key.pub -o "${PRENAME}_db.sql.gz.age"     pre_db.sql.gz
          age -R key.pub -o "${PRENAME}_assets.tar.gz.age" pre_assets.tar.gz
          rm -f pre_db.sql.gz pre_assets.tar.gz key.pub
          rclone copy "${PRENAME}_db.sql.gz.age"     gdrive:prerestore/ -P
          rclone copy "${PRENAME}_assets.tar.gz.age" gdrive:prerestore/ -P

      - name: Determine which backup to restore
        run: |
          # pipefail matters in the two jq reads at the foot of this step: a jq
          # that fails inside $(...) otherwise yields an empty string, and an
          # empty TARGET_BASE turns into a download of "gdrive:/_db.sql.gz.age"
          # several steps later, where the cause is no longer visible.
          set -o pipefail
          MODE="${{ github.event.client_payload.mode || github.event.inputs.mode || 'latest' }}"
          FOLDER="${{ github.event.client_payload.folder || github.event.inputs.folder || '' }}"
          BASENAME="${{ github.event.client_payload.baseName || github.event.inputs.baseName || '' }}"

          if [ "$MODE" = "specific" ] && [ -n "$FOLDER" ] && [ -n "$BASENAME" ]; then
            echo "TARGET_FOLDER=$FOLDER" >> $GITHUB_ENV
            echo "TARGET_BASE=$BASENAME" >> $GITHUB_ENV
          else
            : > /tmp/all.jsonl
            for f in daily weekly monthly; do
              rclone lsjson "gdrive:$f" --files-only 2>/dev/null \
                | jq -c --arg f "$f" '.[] | select(.Name | endswith("_db.sql.gz.age")) | {folder:$f, name:.Name, modTime:.ModTime}' \
                >> /tmp/all.jsonl || true
            done
            if [ ! -s /tmp/all.jsonl ]; then
              echo "No backups found in daily/weekly/monthly — nothing to restore."
              exit 1
            fi
            BEST=$(jq -s 'sort_by(.modTime) | last' /tmp/all.jsonl)
            echo "TARGET_FOLDER=$(echo "$BEST" | jq -r '.folder')" >> $GITHUB_ENV
            echo "TARGET_BASE=$(echo "$BEST" | jq -r '.name' | sed 's/_db\.sql\.gz\.age$//')" >> $GITHUB_ENV
          fi

      - name: Download and decrypt the target backup
        run: |
          set -o pipefail
          rclone copy "gdrive:${TARGET_FOLDER}/${TARGET_BASE}_db.sql.gz.age"     . -P
          rclone copy "gdrive:${TARGET_FOLDER}/${TARGET_BASE}_assets.tar.gz.age" . -P
          echo "${{ secrets.AGE_PRIVATE_KEY }}" > key.age
          age -d -i key.age -o db.sql.gz     "${TARGET_BASE}_db.sql.gz.age"
          age -d -i key.age -o assets.tar.gz "${TARGET_BASE}_assets.tar.gz.age"
          rm -f key.age

          # Same three checks backup.yml runs on the way out. A backup is worth
          # nothing until it is read back, and this is the moment it is read.
          test "$(stat -c%s db.sql.gz)" -gt 10240 || { echo "Restored dump suspiciously small"; exit 1; }
          gzip -t db.sql.gz
          zcat db.sql.gz | tail -5 | grep -q "PostgreSQL database dump complete" \
            || { echo "Restored dump is truncated"; exit 1; }

      - name: Restore database
        env:
          # Both are passed in and the choice is made in shell, deliberately.
          # The obvious expression — `IS_DRILL && secrets.DRILL || secrets.PROD`
          # — is a trap: GitHub's && yields the right-hand value, so an unset
          # DRILL_DATABASE_URL makes it empty, empty is falsy, and || then hands
          # back the production connection. Choosing a drill would restore over
          # production, silently, with the summary still saying "drill".
          PROD_CONN:  ${{ secrets.SUPABASE_DIRECT_URL }}
          DRILL_CONN: ${{ secrets.DRILL_DATABASE_URL }}
        run: |
          # Three things were missing here, and together they meant a restore
          # that destroyed the database and failed to refill it would finish
          # green:
          #
          #   pipefail          — the default shell is `bash -e` without it, so
          #                       a gunzip dying on a truncated file was invisible
          #   ON_ERROR_STOP     — psql otherwise prints errors and exits 0
          #   --single-transaction — the restore clears the target before it
          #                       loads, so a failure halfway without this
          #                       leaves the database emptied and not refilled
          #
          # All-or-nothing is the only acceptable shape for this: a restore that
          # fails now leaves the pre-restore state exactly as it was.
          set -o pipefail
          if [ "$IS_DRILL" = "true" ]; then
            PGCONN="$DRILL_CONN"
            test -n "$PGCONN" || { echo "A drill was selected but DRILL_DATABASE_URL is not set. Refusing to fall back to production."; exit 1; }
            echo "Restoring into the DRILL database."
          else
            PGCONN="$PROD_CONN"
            test -n "$PGCONN" || { echo "SUPABASE_DIRECT_URL is not set"; exit 1; }
            echo "Restoring into PRODUCTION."
          fi
          # Identical on both paths, deliberately. This used to strip
          # CREATE/COMMENT ON EXTENSION for the drill, on the belief that the
          # drill target would be a plain Postgres. That belief was wrong, and
          # the filter made the rehearsal less faithful than the thing it
          # rehearses.
          #
          # The dump carries event triggers that call
          # extensions.set_graphql_placeholder(). Event triggers belong to no
          # schema, so no --exclude-schema removes them and pg_dump has no
          # option that does — which is why the nightly verifier in backup.yml
          # loads tolerantly and is judged on table and row counts instead.
          # Here ON_ERROR_STOP stays on, because a half-applied restore is the
          # failure that matters, and that means the target has to be a
          # database where those functions exist: DRILL_DATABASE_URL must be a
          # Supabase project, not a stock Postgres server.
          #
          # Once it is, there is nothing left for the drill to do differently.
          # A drill that skips statements production runs is not a rehearsal of
          # production; it is a rehearsal of something easier.
          # Clearing the target is the restore's job, not the dump's.
          #
          # The dump used to carry --clean's DROP section, and every restore
          # failure so far lived in it. The last one is the clearest: --if-exists
          # binds to the object named, not to the table it hangs off, so
          #
          #   DROP TRIGGER IF EXISTS trg_... ON public."SuperAdmin";
          #
          # errors on Postgres 17 when that table is absent. It passes against a
          # populated database and fails against an empty one — so the restore
          # worked only where the thing being restored was already there, which
          # is the case that needs it least. Losing a project outright means
          # restoring into a new and empty one, and that is the path that has to
          # work.
          #
          # One statement, and it works the same on an empty target as on a
          # full one. It is deliberately the whole schema rather than only what
          # the dump names: a restore means "make this match the backup", and a
          # table added since is not in the backup.
          #
          # Nothing is lost by dropping it. public's only privilege is
          # postgres's own ({postgres=UC/postgres}) and every table's is the
          # default, so there are no grants to anon, authenticated or
          # service_role that recreating the schema would discard. The dump's
          # own CREATE SCHEMA public brings it back — which backup.yml asserts
          # is present, because this step depends on it.
          #
          # In the same transaction as the load, so a failure anywhere leaves the
          # target exactly as it was.
          { cat <<'RESET'
          DROP SCHEMA IF EXISTS public CASCADE;
          RESET
            gunzip -c db.sql.gz
          } | /usr/lib/postgresql/17/bin/psql "$PGCONN" \
            --single-transaction -v ON_ERROR_STOP=1 -q --echo-errors

      - name: Verify the restored database
        env:
          PROD_CONN:  ${{ secrets.SUPABASE_DIRECT_URL }}
          DRILL_CONN: ${{ secrets.DRILL_DATABASE_URL }}
        run: |
          if [ "$IS_DRILL" = "true" ]; then PGCONN="$DRILL_CONN"; else PGCONN="$PROD_CONN"; fi
          # Applying without error is most of the answer; these counts are the
          # rest. A restore that succeeds into an empty database is the failure
          # this catches, and it is the one nobody would notice until somebody
          # tried to sign in.
          count() {
            /usr/lib/postgresql/17/bin/psql "$PGCONN" -At -c "SELECT count(*) FROM \"$1\""
          }
          USERS=$(count User)
          COMPANIES=$(count Company)
          TASKS=$(count Task)
          echo "RESTORE_ROWS=$USERS users, $COMPANIES companies, $TASKS tasks" >> $GITHUB_ENV
          echo "restored: $USERS users, $COMPANIES companies, $TASKS tasks"
          test "$USERS" -gt 0 || { echo "Restore completed but the database holds no users"; exit 1; }

      # Skipped for a drill. The drill has its own database but there is only
      # one storage bucket, so syncing here would overwrite production's files
      # from a rehearsal — the exact accident this workflow exists to recover
      # from.
      - name: Restore storage
        if: env.IS_DRILL != 'true'
        run: |
          tar -xzf assets.tar.gz

          # sync, not copy — a real restore should make the bucket match the
          # snapshot exactly, including removing files added after it was taken.
          #
          # Which is why it is gated on the manifest. sync deletes whatever is
          # not in the source, so an empty or half-copied snapshot would empty
          # the bucket rather than refill it. The manifest is the only thing
          # that separates "this snapshot is genuinely empty" from "this
          # snapshot failed to copy", and without it the most destructive step
          # in the system trusted an input nothing ever checked.
          if [ ! -f manifest.json ]; then
            # Every backup taken before the manifest existed lands here, so
            # refusing outright would make the whole current archive
            # unrestorable. copy instead: it adds and overwrites but never
            # deletes, so the files come back and nothing can be lost. The
            # bucket may end up holding extras the snapshot did not have, which
            # is a far better failure than an empty one.
            echo "::warning::This snapshot predates the manifest. Using copy rather than sync —"
            echo "::warning::files will be restored, but anything added since the snapshot stays."
            rclone copy ./assets supa:app-assets -P
            exit 0
          fi

          EXPECTED=$(jq -r '.count' manifest.json)
          FOUND=$(find ./assets -type f | wc -l)
          echo "snapshot manifest says $EXPECTED objects; tarball holds $FOUND files"
          # Short of the manifest is the dangerous direction and the only one
          # that fails: that is the half-copied snapshot sync would turn into
          # deletions. More files than the manifest expected is odd but costs
          # nothing.
          test "$FOUND" -ge "$EXPECTED" \
            || { echo "Asset snapshot is incomplete: manifest says $EXPECTED, tarball holds $FOUND"; exit 1; }

          rclone sync ./assets supa:app-assets -P

      - name: Prune old pre-restore snapshots
        if: env.IS_DRILL != 'true'
        run: |
          rclone delete gdrive:prerestore --min-age 30d || true

      - name: Report
        if: always()
        run: |
          if [ "$IS_DRILL" = "true" ]; then
            echo "### Drill restore ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
            echo "Restored into the drill database. Production and the storage bucket were not touched." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Restore ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
            echo "Pre-restore safety snapshot: prerestore/${PRENAME:-not taken}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Restored: ${TARGET_FOLDER:-?}/${TARGET_BASE:-?}" >> $GITHUB_STEP_SUMMARY
          echo "Row check: ${RESTORE_ROWS:-did not run}" >> $GITHUB_STEP_SUMMARY
