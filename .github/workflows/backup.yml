name: Backup to Google Drive

on:
  schedule:
    - cron: '0 1 * * *'          # 01:00 UTC = 03:00 Africa/Cairo (UTC+2 winter)
  workflow_dispatch:              # manual "Run workflow" button
    inputs:
      label:
        description: 'Optional label for this backup'
        required: false
        default: 'manual'
      destination:
        # The folder decides how long the copy survives — 7 days, 28, or 365 —
        # and until now it was decided entirely by today's date, so a
        # long-horizon copy could only be taken on the 1st of a month.
        #
        # That was the whole of G1. The dump format changed on 17 September and
        # every monthly older than that is unrestorable, but the earliest a
        # replacement could be filed was 1 October: a fortnight with no
        # restorable long-horizon copy and no way to shorten it.
        description: 'Which retention folder to file this under'
        required: false
        default: 'auto'
        type: choice
        options: [auto, daily, weekly, monthly]
  repository_dispatch:            # fired from the dashboard maintenance page
    types: [manual-backup]

concurrency:
  group: maktab-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # A throwaway Postgres to load each night's dump back into, so "the backup
    # ran" and "the backup can be restored" stop being the same claim. It never
    # sees production: the only thing that reaches it is the file this job just
    # produced.
    #
    # A plain postgres image rather than Supabase's. That claim used to be
    # wrong — the dump carried Supabase's own globals and this container choked
    # on them for three runs straight. It is true now, and true by construction
    # rather than by hope: --schema=public dumps only objects inside one schema,
    # and extensions and event triggers are not in any schema.
    services:
      verifier:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates gnupg age jq
          # ubuntu-latest's default apt repos only carry postgresql-client-16,
          # but Supabase runs Postgres 17 — pg_dump refuses to dump from a
          # server newer than itself ("aborting because of server version
          # mismatch"). Add the official PGDG apt repo to get a matching
          # client instead. Bump the version below if Supabase upgrades again.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone remote
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      # Before spending thirty seconds on a dump that has nowhere to go. The
      # credential is the single most likely thing to be wrong — it expires on
      # its own, it lives in two places that can drift apart, and when it fails
      # rclone reports it as a page of URL-encoded Drive query, a hundred
      # seconds into the run, three times over.
      - name: Check the Drive credential first
        run: |
          if rclone lsd gdrive: >/dev/null 2>/tmp/gdrive-err; then
            echo "Google Drive reachable."
            exit 0
          fi

          if grep -q invalid_grant /tmp/gdrive-err; then
            echo "::error::invalid_grant — Google rejected the refresh token."
            echo "::error::RCLONE_CONFIG_GDRIVE_TOKEN is stale, malformed, or was minted"
            echo "::error::against a different client_id/client_secret than the two secrets"
            echo "::error::beside it. Re-mint with 'rclone config reconnect gdrive:' and"
            echo "::error::update BOTH the GitHub secret and the Vercel env var of that name."
          else
            echo "::error::Google Drive is unreachable, and not because of the token."
          fi

          # Redact anything long enough to be a credential before printing the
          # underlying error: rclone echoes the full request, and the folder id
          # travels in it.
          sed -E 's/[A-Za-z0-9_-]{20,}/***/g' /tmp/gdrive-err
          exit 1

      - name: Dump database
        env:
          PGCONN: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          # pipefail, because the default shell here is `bash -e` without it:
          # a pg_dump that dies mid-stream otherwise leaves a truncated .gz and
          # the step still exits 0 on gzip's success. The verify step below
          # catches that too, but a failure should fail where it happens.
          set -o pipefail
          STAMP=$(TZ=Africa/Cairo date +%Y-%m-%d_%H%M)
          # E3: the label input existed since this workflow was written and was
          # read by nothing — every manual run was called "manual", whatever it
          # was taken for. It matters now that a run can be filed as a monthly:
          # a long-horizon copy taken for a particular reason should say so from
          # its own filename, because that is all anybody has a year later.
          #
          # Sanitised rather than trusted: this becomes part of a path, so
          # anything that is not a letter, digit, dash or underscore is dropped.
          LABEL=$(printf '%s' "${{ github.event.inputs.label }}" | tr -cd '[:alnum:]_-' | cut -c1-32)
          KIND="${{ github.event_name == 'schedule' && 'auto' || 'manual' }}"
          [ -n "$LABEL" ] && KIND="$LABEL"
          echo "NAME=maktab_${STAMP}_${KIND}" >> $GITHUB_ENV
          # Call the versioned binary directly rather than the unversioned
          # `pg_dump` on PATH — installing postgresql-client-17 alongside
          # the runner image's pre-existing postgresql-client-16 doesn't
          # make 17 the one PATH resolves to.
          #
          # --schema=public, not a list of schemas to exclude.
          #
          # This was a denylist for months and it failed four times, each time
          # in a way the previous fix had not anticipated: CREATE EXTENSION in
          # pg_catalog, then COPY cron.job, then event triggers belonging to no
          # schema at all, and finally "must be owner of event trigger
          # pgrst_drop_watch" — which is the one that matters, because it would
          # have failed a *production* restore identically. All eight event
          # triggers are owned by supabase_admin and the connection role is
          # postgres, so --clean emits a DROP for each and the role cannot
          # execute any of them.
          #
          # A denylist has to enumerate everything the platform might ever add.
          # An allowlist has to name what we own, which is one schema: 30 tables,
          # 9 enums, one function and _prisma_migrations, all in public, which
          # postgres owns. Objects with no schema — event triggers, extensions —
          # are not dumped at all under -n, so the whole class disappears at the
          # source rather than being filtered downstream.
          # No --clean either. The DROP section it generates is where every
          # restore failure has lived, and the last one showed why: --if-exists
          # binds to the object named, not to the table it hangs off, so
          #
          #   DROP TRIGGER IF EXISTS trg_... ON public."SuperAdmin";
          #
          # is an error on Postgres 17 when the table is absent. That statement
          # passes on production, where the table exists, and fails on an empty
          # database — which is the one target that matters most, because a
          # project lost outright is restored into a new and empty one.
          #
          # A dump describes the source. What to clear at the other end is the
          # restore's decision, and restore.yml makes it from what is actually
          # there rather than from a list generated against a different database
          # at a different time.
          /usr/lib/postgresql/17/bin/pg_dump "$PGCONN" \
            --no-owner --no-privileges \
            --schema=public \
            | gzip -9 > db.sql.gz
          ls -lh db.sql.gz

      - name: Verify the dump is not empty or truncated
        run: |
          set -o pipefail
          test "$(stat -c%s db.sql.gz)" -gt 10240 || { echo "Dump suspiciously small"; exit 1; }
          gzip -t db.sql.gz
          zcat db.sql.gz | tail -5 | grep -q "PostgreSQL database dump complete" \
            || { echo "Dump is truncated"; exit 1; }

      - name: Mirror the storage bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Supabase's S3-compatible endpoint needs its own dedicated
          # access-key pair (Storage -> S3 Configuration -> Access keys in
          # the dashboard) — the service_role key isn't valid here at all,
          # even though it was previously (incorrectly) reused for both
          # fields below and never actually exercised until this workflow
          # ran for real.
          S3_ACCESS_KEY_ID:     ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          cat >> ~/.config/rclone/rclone.conf <<EOF
          [supa]
          type = s3
          provider = Other
          access_key_id = ${S3_ACCESS_KEY_ID}
          secret_access_key = ${S3_SECRET_ACCESS_KEY}
          endpoint = ${SUPABASE_URL}/storage/v1/s3
          region = eu-west-1
          EOF

          # This copy used to end in `|| true`, which made the asset half of
          # every backup unfailable: broken S3 credentials produced an empty
          # directory, a valid-looking tarball, and a green run. That mattered
          # far more than it looked, because restore.yml *syncs* this directory
          # over the bucket — so a backup that silently captured nothing became
          # a restore that deliberately deleted everything.
          mkdir -p ./assets
          rclone copy supa:app-assets ./assets --transfers 8 --fast-list

          # The manifest is what lets the other end tell "this snapshot is
          # genuinely empty" from "this snapshot failed to copy". It travels
          # inside the tarball beside the tree it describes, never inside
          # ./assets itself — anything under there would be synced into the
          # bucket on restore.
          rclone size supa:app-assets --json > manifest.json
          cat manifest.json

          EXPECTED=$(jq -r '.count' manifest.json)
          COPIED=$(find ./assets -type f | wc -l)
          echo "bucket reports $EXPECTED objects; copied $COPIED files"
          test "$COPIED" -ge "$EXPECTED" \
            || { echo "Asset mirror incomplete: expected $EXPECTED, copied $COPIED"; exit 1; }

          tar -czf assets.tar.gz assets manifest.json

      - name: Encrypt
        run: |
          echo "${{ secrets.AGE_PUBLIC_KEY }}" > key.pub
          age -R key.pub -o "${NAME}_db.sql.gz.age"     db.sql.gz
          age -R key.pub -o "${NAME}_assets.tar.gz.age" assets.tar.gz
          rm -f assets.tar.gz key.pub

      - name: Upload to Google Drive
        run: |
          # A named destination wins; "auto" (and the nightly schedule, which
          # sends nothing) falls through to the calendar. Deliberately not a
          # boolean "force monthly": weekly is a real answer too, and a choice
          # that can only say one thing gets used for the thing it cannot say.
          CHOICE="${{ github.event.inputs.destination }}"
          case "$CHOICE" in
            daily|weekly|monthly)
              DEST="$CHOICE"
              echo "Filing under $DEST because this run asked for it."
              ;;
            *)
              DEST="daily"
              [ "$(date +%u)" = "7" ] && DEST="weekly"
              [ "$(date +%d)" = "01" ] && DEST="monthly"
              echo "Filing under $DEST by the calendar."
              ;;
          esac
          rclone copy "${NAME}_db.sql.gz.age"     "gdrive:${DEST}/" -P
          rclone copy "${NAME}_assets.tar.gz.age" "gdrive:${DEST}/" -P

      # Deliberately after the upload, not before. A dump that fails to load is
      # still better than no dump at all, so it gets stored and *then* flagged;
      # and because this failing stops the job, the prune below never runs, so
      # a night that cannot prove itself also cannot age out the nights that
      # could.
      # After the upload, like the restore proof below and for the same reason:
      # a dump that fails a check is still better than no dump at all. In its
      # first position — before the upload — a failed assertion meant the night
      # was not stored, which is the opposite of what a check on the backup is
      # for.
      #
      # Every pattern here was in a real dump and each one broke a real restore.
      - name: Verify the dump carries nothing the restore role cannot own
        run: |
          set -o pipefail
          # Decompressed once to a file, and every check reads the file.
          #
          # Not `zcat db.sql.gz | grep -q ...`: grep -q exits on the first match
          # and zcat then dies of SIGPIPE, which under pipefail makes the whole
          # pipeline non-zero — so a *successful* match read as a failure, and
          # an `if zcat | grep -q` guard could never fire at all. That shipped,
          # and it reported a dump as missing the very statement it contained.
          zcat db.sql.gz > /tmp/dump.sql

          forbid() {
            if grep -qE "$1" /tmp/dump.sql; then
              echo "Dump contains $2:"
              grep -nE "$1" /tmp/dump.sql | head -5
              exit 1
            fi
          }

          # No DROP section of any kind. Every statement in one asserts
          # something about a target the dump has never seen, and that is where
          # each restore failure has lived. Clearing the target is restore.yml's
          # job now.
          forbid '^(DROP|ALTER TABLE IF EXISTS) ' 'DROP statements; it should describe the source only'

          # Platform objects the postgres role does not own and cannot recreate.
          forbid '^(DROP|CREATE|ALTER|COMMENT ON) EVENT TRIGGER' 'an EVENT TRIGGER statement'
          forbid '^(DROP|CREATE|ALTER|COMMENT ON) EXTENSION' 'an EXTENSION statement'

          # And that it carries the application, so a dump of nothing cannot
          # satisfy every check above.
          TABLES=$(grep -cE '^CREATE TABLE public\.' /tmp/dump.sql)
          test "$TABLES" -ge 25 || { echo "Only $TABLES tables in the dump"; exit 1; }

          # Required, because restore.yml drops the schema and depends on the
          # dump to bring it back. Backup 34 established that it does — by
          # executing the statement and colliding with the existing schema —
          # while the first version of this check claimed the opposite, being
          # broken in the way described above. If pg_dump ever stops emitting
          # it, this fails on the night it changes rather than leaving a restore
          # to discover it against an empty database.
          grep -qE '^CREATE SCHEMA public;' /tmp/dump.sql \
            || { echo "Dump has no CREATE SCHEMA public; restore.yml drops the schema and relies on it"; exit 1; }

          echo "Dump carries $TABLES application tables, recreates its schema, and holds no platform objects."
          rm -f /tmp/dump.sql

      - name: Prove the dump restores
        env:
          PGPASSWORD: verify
        run: |
          set -o pipefail
          /usr/lib/postgresql/17/bin/psql -h localhost -U postgres -c 'CREATE DATABASE verify'

          # Strict, and identical to what restore.yml runs.
          #
          # This was tolerant — ON_ERROR_STOP=0, errors printed and ignored,
          # judged only on the row counts below. That was the right call while
          # the dump carried Supabase's globals, which a stock image has nowhere
          # to put, and the wrong one the moment it stopped: a tolerant load
          # cannot tell "the dump applies cleanly" from "the dump applies apart
          # from the eight statements that would abort a real restore", and it
          # was the second of those for months.
          #
          # --schema=public removed the globals at the source, so the nightly
          # check can now ask the same question the disaster will: does this
          # dump load, all of it, without error?
          # The same reset restore.yml runs, for the same reason: a fresh
          # database already has a public schema, and the dump recreates its
          # own. Prepending it here is also what keeps this an honest rehearsal
          # — the nightly check runs the restore's exact sequence, not a
          # simplified one.
          { echo 'DROP SCHEMA IF EXISTS public CASCADE;'; gunzip -c db.sql.gz; } \
            | /usr/lib/postgresql/17/bin/psql -h localhost -U postgres -d verify \
              --single-transaction -v ON_ERROR_STOP=1 -q --echo-errors

          count() {
            /usr/lib/postgresql/17/bin/psql -h localhost -U postgres -d verify -At -c "$1"
          }

          # The application's own tables. If the schema did not build, this is
          # zero and everything below is moot.
          TABLES=$(count "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          echo "public schema: $TABLES tables"
          test "$TABLES" -ge 25 \
            || { echo "Only $TABLES tables restored — the schema did not come back"; exit 1; }

          USERS=$(count 'SELECT count(*) FROM "User"')
          COMPANIES=$(count 'SELECT count(*) FROM "Company"')
          TASKS=$(count 'SELECT count(*) FROM "Task"')
          echo "restored: $USERS users, $COMPANIES companies, $TASKS tasks"
          echo "RESTORE_ROWS=$TABLES tables, $USERS users, $COMPANIES companies, $TASKS tasks" >> $GITHUB_ENV

          # A dump that applies cleanly into an empty database is the failure
          # nobody notices until somebody tries to sign in.
          test "$USERS" -gt 0 || { echo "Dump restored but holds no users"; exit 1; }

      - name: Prune old backups
        run: |
          # || true on each: a folder that has never received a backup yet
          # (e.g. weekly/monthly, before this has run on a Sunday or the
          # 1st of a month) makes rclone delete fail with "directory not
          # found" rather than no-op — not a real error, just nothing to
          # prune yet.
          rclone delete gdrive:daily   --min-age 7d   || true
          rclone delete gdrive:weekly  --min-age 28d  || true
          rclone delete gdrive:monthly --min-age 365d || true

      - name: Report
        if: always()
        run: |
          echo "### Backup ${{ job.status }} — $NAME" >> $GITHUB_STEP_SUMMARY
          echo "Restore check: ${RESTORE_ROWS:-did not run}" >> $GITHUB_STEP_SUMMARY
          rclone size gdrive: >> $GITHUB_STEP_SUMMARY
